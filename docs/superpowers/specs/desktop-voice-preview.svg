<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1050" viewBox="0 0 1280 1050">
  <defs>
    <linearGradient id="frame" x2="0" y2="1"><stop stop-color="#1b1d23"/><stop offset="1" stop-color="#08090b"/></linearGradient>
    <radialGradient id="sphere" cx="38%" cy="30%" r="80%"><stop stop-color="#f4f7ff"/><stop offset=".24" stop-color="#bfdcff"/><stop offset=".52" stop-color="#6d91da"/><stop offset=".76" stop-color="#34305e"/><stop offset="1" stop-color="#141524"/></radialGradient>
    <radialGradient id="pearl" cx="44%" cy="32%"><stop stop-color="#f7f8ff" stop-opacity=".9"/><stop offset=".42" stop-color="#aae2ff" stop-opacity=".3"/><stop offset="1" stop-color="#7aa2ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="ribbon"><stop stop-color="#e7f4ff"/><stop offset=".5" stop-color="#a7ceff"/><stop offset="1" stop-color="#bfa9ff"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#6c8dff" stop-opacity=".17"/><stop offset="1" stop-color="#6c8dff" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="light"><feGaussianBlur stdDeviation="3.5"/></filter>
    <filter id="liquid"><feTurbulence type="fractalNoise" baseFrequency=".009" numOctaves="2" seed="7" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="32" xChannelSelector="R" yChannelSelector="G"/></filter>
    <clipPath id="orbClip"><circle cx="0" cy="0" r="141"/></clipPath>
    <g id="orb">
      <circle r="141" fill="url(#sphere)"/>
      <g clip-path="url(#orbClip)">
        <ellipse cx="-26" cy="-54" rx="110" ry="108" fill="url(#pearl)"/>
        <g filter="url(#liquid)">
          <path d="M-164 16C-77-104 8 129 157-48" fill="none" stroke="url(#ribbon)" stroke-width="48" opacity=".72" filter="url(#soft)"/>
          <path d="M-149 36C-31-80 26 164 149-56" fill="none" stroke="#d4e8ff" stroke-width="13" opacity=".72" filter="url(#light)"/>
          <path d="M-115-98C83-89-56 45 148 15" fill="none" stroke="#e3dcff" stroke-width="33" opacity=".65" filter="url(#soft)"/>
          <path d="M-145 109C-47 30 40 115 136 37" fill="none" stroke="#7aa2ff" stroke-width="32" opacity=".55" filter="url(#soft)"/>
        </g>
        <ellipse cx="-52" cy="-74" rx="64" ry="27" fill="#ffffff" opacity=".28" transform="rotate(-26)" filter="url(#soft)"/>
      </g>
      <circle r="140.5" fill="none" stroke="#d2e6ff" stroke-opacity=".27"/>
    </g>
    <g id="mic" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="-3.5" y="-8" width="7" height="11" rx="3.5"/><path d="M-7-1a7 7 0 0014 0M0 6v4M-4 10h8"/></g>
  </defs>
  <rect width="1280" height="1050" fill="#08090b"/>
  <g font-family="Segoe UI Variable Text, Segoe UI, sans-serif">
    <text x="38" y="35" fill="#9398a1" font-size="13">Ankita desktop voice — design preview</text>
    <rect x="24" y="57" width="1232" height="737" rx="23" fill="url(#frame)" stroke="#363941"/>
    <circle cx="48" cy="81" r="5" fill="#ff8d97"/><circle cx="66" cy="81" r="5" fill="#d5ba78"/><circle cx="84" cy="81" r="5" fill="#76b898"/>
    <text x="48" y="134" fill="#f5f6f8" font-weight="600" font-size="19">Ankita</text>
    <rect x="40" y="169" width="148" height="39" rx="10" fill="#1d1f23"/>
    <text x="59" y="194" fill="#f5f6f8" font-size="13">Conversations</text>
    <text x="59" y="241" fill="#9398a1" font-size="13">Projects</text>
    <text x="59" y="286" fill="#9398a1" font-size="13">Plugins</text>
    <path d="M48 325H179" stroke="#292b31"/>
    <circle cx="61" cy="365" r="14" fill="#28344f"/><text x="56" y="370" fill="#a8c8ff" font-size="12">A</text>
    <text x="84" y="362" fill="#e7eaf0" font-size="12">Ankita</text><text x="84" y="380" fill="#9398a1" font-size="10">Voice conversation</text>
    <text x="59" y="754" fill="#9398a1" font-size="13">Settings</text>
    <rect x="211" y="69" width="1033" height="713" rx="17" fill="#0e0f11" stroke="#2c2e35"/>
    <path d="M241 104l-5 5 5 5M236 109h16" stroke="#b9bdc5" stroke-width="1.5" fill="none"/>
    <text x="265" y="114" fill="#b9bdc5" font-size="12">Back to chat</text>
    <text x="729" y="113" fill="#f5f6f8" font-size="13" text-anchor="middle">Voice with Ankita</text>
    <rect x="1069" y="92" width="151" height="33" rx="16" fill="#1d1f23" stroke="#393c45"/>
    <text x="1145" y="113" fill="#d2d7e1" font-size="11" text-anchor="middle">Continue in island ↗</text>
    <circle cx="729" cy="319" r="227" fill="url(#halo)"/>
    <use href="#orb" transform="translate(729 318)"/>
    <circle cx="692" cy="493" r="3.5" fill="#bfa9ff"/><text x="706" y="498" fill="#b9bdc5" font-size="13">Working</text>
    <text x="729" y="546" fill="#9398a1" font-size="11" text-anchor="middle">You asked</text>
    <text x="729" y="583" fill="#f5f6f8" font-size="29" font-weight="450" text-anchor="middle">Workspace bana do,</text>
    <text x="729" y="622" fill="#f5f6f8" font-size="29" font-weight="450" text-anchor="middle">aur VS Code mein kholo.</text>
    <rect x="535" y="648" width="388" height="38" rx="12" fill="#141518" stroke="#282b32"/>
    <circle cx="556" cy="667" r="3" fill="#7aa2ff"/><text x="570" y="672" fill="#b9bdc5" font-size="12">Creating your workspace</text>
    <circle cx="618" cy="721" r="21" fill="#1d1f23" stroke="#3a3d45"/><use href="#mic" transform="translate(618 720)" color="#d2d7e1"/>
    <rect x="655" y="700" width="145" height="42" rx="21" fill="#40272e" stroke="#6a3a44"/><text x="728" y="727" fill="#ffc8cd" font-size="12" text-anchor="middle">End voice</text>
    <circle cx="837" cy="721" r="21" fill="#1d1f23" stroke="#3a3d45"/><rect x="831" y="715" width="12" height="12" rx="2" fill="#d2d7e1"/>
    <text x="729" y="764" fill="#9398a1" font-size="10" text-anchor="middle">End voice keeps your work running. Stop work cancels it.</text>
    <text x="640" y="848" fill="#9398a1" font-size="13" text-anchor="middle">The same session, in the floating island</text>
    <rect x="429" y="879" width="422" height="78" rx="29" fill="#141518" stroke="#424650"/>
    <use href="#orb" transform="translate(472 918) scale(.16)"/>
    <text x="512" y="910" fill="#f5f6f8" font-size="13">Creating your workspace</text>
    <text x="512" y="932" fill="#9398a1" font-size="11">Working with Ankita</text>
    <use href="#mic" transform="translate(765 918) scale(.8)" color="#b9bdc5"/>
    <path d="M804 924l11-11M807 913h8v8" stroke="#b9bdc5" stroke-width="1.6" fill="none"/>
    <text x="640" y="1008" fill="#777e8a" font-size="11" text-anchor="middle">Static concept. States, captions and controls connect to real voice work in the implementation.</text>
  </g>
</svg>
