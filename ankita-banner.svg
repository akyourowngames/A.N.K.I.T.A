<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- chat bubbles -->
  <rect x="930" y="70" width="180" height="86" rx="18" fill="#0f172a" fill-opacity="0.55"/>
  <rect x="950" y="92" width="120" height="10" rx="5" fill="#2dd4bf"/>
  <rect x="950" y="116" width="90" height="10" rx="5" fill="#94a3b8"/>
  <rect x="950" y="140" width="140" height="10" rx="5" fill="#cbd5e1"/>

  <rect x="1010" y="170" width="170" height="86" rx="18" fill="#0f172a" fill-opacity="0.55"/>
  <rect x="1030" y="192" width="120" height="10" rx="5" fill="#a855f7"/>
  <rect x="1030" y="216" width="100" height="10" rx="5" fill="#cbd5e1"/>

  <!-- title -->
  <text x="64" y="124" fill="#f8fafc" font-size="72" font-weight="800" letter-spacing="-1">A.N.K.I.T.A</text>
  <rect x="64" y="144" width="240" height="6" rx="3" fill="url(#accent)"/>
  <text x="64" y="190" fill="#ccfbf1" font-size="26" font-weight="500">Your always-on personal AI assistant</text>
  <text x="64" y="226" fill="#94a3b8" font-size="20">Voice · Memory · Telegram · Desktop tools · Project monitoring</text>

  <!-- pillars -->
  <text x="64" y="282" fill="#2dd4bf" font-size="19" font-weight="700">⌁ Hear</text>
  <text x="184" y="282" fill="#a855f7" font-size="19" font-weight="700">⚡ Act</text>
  <text x="304" y="282" fill="#f472b6" font-size="19" font-weight="700">✦ Remember</text>
</svg>
