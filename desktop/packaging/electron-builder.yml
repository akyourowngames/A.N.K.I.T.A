appId: com.ankita.desktop
productName: Ankita
copyright: Copyright © 2026 Ankita
publish:
  provider: github
  owner: akyourowngames
  repo: A.N.K.I.T.A
  releaseType: release
directories:
  output: desktop/release
  buildResources: desktop/build
files:
  - package.json
  - desktop/electron/**/*
  - desktop/shared/**/*
  # Main-process modules import companion runtime modules directly. The same
  # companion also ships in extraResources because Chrome extensions cannot load
  # from an ASAR; both copies are generated from this one source tree.
  - desktop/chatgpt-companion/**/*
  - desktop/browser-helper/**/*
  - desktop/THIRD_PARTY_NOTICES.md
  - desktop/renderer/dist/**/*
  - src/**/*
  - tools/**/*
  - skills/**/*
  - services/chatgpt-bridge/**/*
  - vendor/chat-on-steroids/**/*
  - vendor/openai-tunnel/**/*
  - '!**/*.test.*'
  - '!desktop/renderer/src/**'
  - '!desktop/build/**'
  - desktop/build/icon.png
  - '!desktop/scripts/**'
  - '!test/**'
  - '!docs/**'
  - '!scripts/**'
  - '!.github/**'
asar: true
extraResources:
  - from: desktop/chatgpt-companion
    to: chatgpt-companion
    filter: ['**/*', '!**/*.d.mts']
  - from: desktop/native-tunnel
    to: native-tunnel
    filter: ['**/*']
  - from: desktop/browser-helper
    to: browser-helper
    filter: ['**/*', '!**/*.d.mts']
# Node-mode children load this self-contained bridge from real files, without
# npm/npx, ASAR loader support, or a runtime package download.
asarUnpack:
  - node_modules/chrome-devtools-mcp/**/*
win:
  # BEGIN publisher signing exclusions (generated from vendor/openai-tunnel/source.json)
  signExts:
    - '!tunnel-client.exe'
    - '!cloudflared.exe'
  # END publisher signing exclusions
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: desktop/build/icon.ico
nsis:
  artifactName: ${productName}-${version}-setup-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Ankita
  uninstallDisplayName: Ankita
portable:
  artifactName: ${productName}-${version}-portable-${arch}.${ext}
mac:
  target: dmg
  category: public.app-category.productivity
  icon: desktop/build/icon.png
linux:
  target: AppImage
  category: Utility
  icon: desktop/build/icon.png
