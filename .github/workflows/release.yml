name: Release desktop

# Releases are created from the package.json version. Pushing to the default
# branch (or running this by hand) creates the matching `v<version>` tag and
# publishes it; pushing a `v*` tag publishes that tag directly. A version whose
# release already has the auto-update manifest (latest.yml) is skipped, so
# ordinary commits do not rebuild.
on:
  push:
    branches:
      - ankita
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      # Azure Trusted Signing (see docs/code-signing.md). Empty secrets just
      # mean the build is published unsigned.
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_PUBLISHER_NAME: ${{ secrets.AZURE_PUBLISHER_NAME }}
      AZURE_CODE_SIGNING_ENDPOINT: ${{ secrets.AZURE_CODE_SIGNING_ENDPOINT }}
      AZURE_CODE_SIGNING_ACCOUNT: ${{ secrets.AZURE_CODE_SIGNING_ACCOUNT }}
      AZURE_CERT_PROFILE: ${{ secrets.AZURE_CERT_PROFILE }}
      # Optional: a classic .pfx certificate instead of Azure. electron-builder
      # picks these up automatically.
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the release tag can be created and pushed.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        continue-on-error: true

      - name: Resolve the version to release
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Releasing v$version"

      - name: Skip if this version is already released
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Require the auto-update manifest, not just the release: a release
          # left behind by a partial upload must be completed, not skipped.
          if gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx 'latest.yml'; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${{ steps.version.outputs.tag }} is already published - nothing to do."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      # A branch/dispatch run has no tag yet, so create one pointing at the
      # commit being released. The tag push uses GITHUB_TOKEN, which does not
      # re-trigger this workflow.
      - name: Create and push the release tag
        if: github.ref_type != 'tag' && steps.check.outputs.exists == 'false'
        shell: bash
        run: |
          if git ls-remote --tags origin "${{ steps.version.outputs.tag }}" | grep -q "refs/tags/${{ steps.version.outputs.tag }}$"; then
            echo "${{ steps.version.outputs.tag }} already exists."
          else
            git tag "${{ steps.version.outputs.tag }}"
            git push origin "${{ steps.version.outputs.tag }}"
          fi

      # Build only. Publishing is a separate, deterministic step below: letting
      # electron-builder create the release races its own parallel target
      # uploads and can 422 mid-way, leaving a release without latest.yml.
      - name: Build (Azure Trusted Signing)
        if: steps.check.outputs.exists == 'false' && env.AZURE_CLIENT_ID != ''
        run: |
          npm run desktop:build
          npx electron-builder --win --publish never --config electron-builder.signing.yml
      - name: Build (unsigned or pfx)
        if: steps.check.outputs.exists == 'false' && env.AZURE_CLIENT_ID == ''
        run: |
          npm run desktop:build
          npx electron-builder --win --publish never

      - name: Publish release with auto-update artifacts
        if: steps.check.outputs.exists == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          manifest="desktop/release/latest.yml"
          if [ ! -f "$manifest" ]; then
            echo "latest.yml was not generated - auto-update would be broken." >&2
            exit 1
          fi
          shopt -s nullglob
          assets=(
            desktop/release/Ankita-"$version"-*.exe
            desktop/release/Ankita-"$version"-*.blockmap
            "$manifest"
          )
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No build artifacts found in desktop/release." >&2
            exit 1
          fi
          printf 'Publishing %s:\n' "$tag"
          printf '  %s\n' "${assets[@]}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${assets[@]}" --title "$version" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
